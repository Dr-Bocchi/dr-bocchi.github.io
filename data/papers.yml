- title: "Generalization properties of the token perceptron: the role of embedding and vocabulary"
  authors: "Dario Bocchi, Matteo Negri, Flavio Nicoletti, Francesco D'Amico"
  year: 2026
  kind: preprint
  venue: "arXiv:2610.32788"
  url: https://arxiv.org/abs/2610.32788
  links:
    - { label: arXiv, url: "https://arxiv.org/abs/2610.32788", icon: file-earmark-text }
    - { label: PDF, url: "https://arxiv.org/pdf/2610.32788", icon: file-earmark-pdf }
  abstract: >-
    Large language models are trained to predict tokens from a finite vocabulary, each represented by a vector
    in a d-dimensional embedding space. Therefore, token prediction is a classification problem whose classes have
    a geometry determined by the embedding. We study how this geometry affects learning in a minimal solvable model:
    a linear predictor that maps a sequence of N embedded tokens to a d-dimensional output through one d×d matrix
    per position, trained in the teacher–student setting. We call this the token perceptron. We compute its
    generalization error with the replica method, taking N → ∞ at fixed number of examples per position α = P/N
    and keeping d and the vocabulary size D finite. As a first reference case, we consider continuous embeddings on
    the sphere, which isolate the role of the embedding dimension. The natural load is then α/d, and for d > 1 a
    normalized label fixes the direction of the teacher output, so the problem becomes a noiseless regression: the
    teacher is recovered exactly above α_rec = d²/(d−1), and spherical cross-entropy reaches this threshold at large
    inverse temperature. In the same setting the storage capacity of random associations scales as d² for margins
    O(1/√d). We then turn to vocabulary embeddings, where a label only identifies the Voronoi cell of the teacher
    output, so that each example imposes inequalities rather than equations, as in the classical perceptron. We
    compute the Bayes-optimal error for a given embedding matrix through an approximate spectral closure and show
    that the optimal learner first resolves the directions in which the vocabulary has the largest variance, even
    when the teacher is isotropic.
  bibtex: |-
    @article{bocchi2026token,
      title={Generalization properties of the token perceptron: the role of embedding and vocabulary},
      author={Bocchi, Dario and Negri, Matteo and Nicoletti, Flavio and D'Amico, Francesco},
      journal={arXiv preprint arXiv:2610.32788},
      year={2026}
    }

- title: "Spectral phase transitions and trainability in neural network learning dynamics"
  authors: "Chanju Park, Dario Bocchi, Francesco D'Amico, Biagio Lucini, Gert Aarts"
  year: 2026
  kind: preprint
  venue: "arXiv:2606.28486"
  url: https://arxiv.org/abs/2606.28486
  links:
    - { label: arXiv, url: "https://arxiv.org/abs/2606.28486", icon: file-earmark-text }
    - { label: PDF, url: "https://arxiv.org/pdf/2606.28486", icon: file-earmark-pdf }
  abstract: >-
    The emergence of low-dimensional structures in the spectra of neural network weight matrices is a common
    empirical feature of trained models, but the dynamical origin of this phenomenon during learning remains an open
    problem. We formulate neural network training as the stochastic evolution of an initially random matrix ensemble,
    driven by stochastic gradient descent (SGD) updates that reshape the spectral bulk while amplifying signal
    strength. This induces a Baik–Ben Arous–Péché (BBP) transition during training, where isolated eigenvalues detach
    from the random bulk distribution, providing a dynamical framework for representation formation in
    high-dimensional learning dynamics. We demonstrate this in a solvable linear teacher–student model, where spectral
    evolution is analytically tractable and a phase diagram of trainability governed by the step size (or learning
    rate) and initial weight variance is obtained, and subsequently extend our formalism beyond the linear regime to
    nonlinear and stochastic settings. Numerical simulations in realistic settings support this picture, showing
    robust emergence of spectral alignment during training. Our results suggest that spectral analysis may provide a
    unified perspective of stochastic learning dynamics, linking trainability, optimisation hyperparameters, spectral
    phase transitions, and representation learning in neural networks.
  bibtex: |-
    @article{park2026spectral,
      title={Spectral phase transitions and trainability in neural network learning dynamics},
      author={Park, Chanju and Bocchi, Dario and D'Amico, Francesco and Lucini, Biagio and Aarts, Gert},
      journal={arXiv preprint arXiv:2606.28486},
      year={2026}
    }

- title: "Discontinuous BBP transitions"
  image: images/papers/discontinuous-bbp.png
  authors: "Dario Bocchi, Giulio Biroli, Chiara Cammarota, Federico Ricci-Tersenghi"
  year: 2026
  kind: preprint
  venue: "arXiv:2604.27992"
  url: https://arxiv.org/abs/2604.27992
  featured: true
  links:
    - { label: arXiv, url: "https://arxiv.org/abs/2604.27992", icon: file-earmark-text }
    - { label: PDF, url: "https://arxiv.org/pdf/2604.27992", icon: file-earmark-pdf }
  abstract: >-
    The Baik–Ben Arous–Péché (BBP) transition sets fundamental limits for detecting low-rank structure in noisy
    high-dimensional data and underlies a wide range of spectral methods in many fields from physics to statistics and
    data sciences. In standard settings, this transition is continuous, implying that signal recovery emerges
    gradually above a sharp threshold. We show that BBP transitions can instead be discontinuous in very general
    settings and provide a full theory of this phenomenon. When the eigenvalue density vanishes faster than linearly
    at the spectral edge, the overlap between the leading eigenvector and the signal jumps discontinuously at the
    critical point. We study this mechanism in deformed Gaussian and reweighted Wishart ensembles. We analyze in
    detail the finite-size effects, which play a central and qualitatively new role in the discontinuous BBP
    transition. Unlike the continuous BBP transition, we establish the existence of an extended pre-critical region
    where informative eigenvectors emerge well before the asymptotic threshold. The main consequence — and difference
    from the continuous BBP transition — is that signal recovery can occur at significantly lower signal-to-noise
    ratio and it is accompanied by strong sample-to-sample variability. Our results show the relevance and the
    novelty of the discontinuous BBP transition, and highlight the practical implications for signal detection.
  bibtex: |-
    @article{bocchi2026discontinuous,
      title={Discontinuous {BBP} transitions},
      author={Bocchi, Dario and Biroli, Giulio and Cammarota, Chiara and Ricci-Tersenghi, Federico},
      journal={arXiv preprint arXiv:2604.27992},
      year={2026}
    }

- title: "Escape dynamics and implicit bias of one-pass SGD in overparameterized quadratic networks"
  authors: "Dario Bocchi, Theotime Regimbeau, Carlo Lucibello, Luca Saglietti, Chiara Cammarota"
  year: 2026
  kind: journal
  venue: "Mach. Learn.: Sci. Technol."
  venue_long: "Machine Learning: Science and Technology 7, 065011"
  url: https://doi.org/10.1088/2632-2153/aeb5a0
  links:
    - { label: DOI, url: "https://doi.org/10.1088/2632-2153/aeb5a0", icon: link-45deg }
    - { label: arXiv, url: "https://arxiv.org/abs/2604.03068", icon: file-earmark-text }
  abstract: >-
    We analyze the one-pass stochastic gradient descent dynamics of a two-layer neural network with quadratic
    activations in a teacher–student framework. In the high-dimensional regime, where the input dimension N and the
    number of samples M diverge at fixed ratio α = M/N, and for finite hidden widths (p, p*) of the student and
    teacher, respectively, we study the low-dimensional ordinary differential equations that govern the evolution of
    the student–teacher and student–student overlap matrices. We show that overparameterization (p > p*) only
    modestly accelerates escape from a plateau of poor generalization by modifying the prefactor of the exponential
    decay of the loss. We then examine how unconstrained weight norms introduce a continuous rotational symmetry that
    results in a nontrivial manifold of zero-loss solutions for p > 1. From this manifold the dynamics consistently
    selects the closest solution to the random initialization, as enforced by a conserved quantity in the ODEs
    governing the evolution of the overlaps. Finally, a Hessian analysis of the population-loss landscape confirms
    that the plateau and the solution manifold correspond to saddles with at least one negative eigenvalue and to
    marginal minima in the population-loss geometry, respectively.
  bibtex: |-
    @article{bocchi2026escape,
      title={Escape dynamics and implicit bias of one-pass {SGD} in overparameterized quadratic networks},
      author={Bocchi, Dario and Regimbeau, Theotime and Lucibello, Carlo and Saglietti, Luca and Cammarota, Chiara},
      journal={Machine Learning: Science and Technology},
      volume={7},
      number={6},
      pages={065011},
      year={2026},
      doi={10.1088/2632-2153/aeb5a0}
    }

- title: "Overparametrization bends the landscape: BBP transitions at initialization in simple Neural Networks"
  image: images/papers/overparametrization.png
  authors: "Brandon Livio Annesi, Dario Bocchi, Chiara Cammarota"
  year: 2026
  kind: conference
  venue: "ICLR 2026"
  venue_long: "International Conference on Learning Representations"
  badge: "Oral"
  url: https://openreview.net/forum?id=xDLE5n3x9Y
  featured: true
  links:
    - { label: OpenReview, url: "https://openreview.net/forum?id=xDLE5n3x9Y", icon: chat-square-text }
    - { label: arXiv, url: "https://arxiv.org/abs/2510.18435", icon: file-earmark-text }
    - { label: Oral, url: "https://iclr.cc/virtual/2026/oral/10006659", icon: mic }
    - { label: Poster, url: "https://iclr.cc/virtual/2026/poster/10006658", icon: easel }
  abstract: >-
    High-dimensional non-convex loss landscapes play a central role in the theory of Machine Learning. Gaining
    insight into how these landscapes interact with gradient-based optimization methods, even in relatively simple
    models, can shed light on this enigmatic feature of neural networks. In this work, we will focus on a
    prototypical simple learning problem, which generalizes the Phase Retrieval inference problem by allowing the
    exploration of overparametrized settings. Using techniques from field theory, we analyze the spectrum of the
    Hessian at initialization and identify a Baik–Ben Arous–Péché (BBP) transition in the amount of data that
    separates regimes where the initialization is informative or uninformative about a planted signal of a
    teacher–student setup. Crucially, we demonstrate how overparameterization can bend the loss landscape, shifting
    the transition point, even reaching the information-theoretic weak-recovery threshold in the large
    overparameterization limit, while also altering its qualitative nature. We distinguish between continuous and
    discontinuous BBP transitions and support our analytical predictions with simulations, examining how they compare
    to the finite-N behavior. In the case of discontinuous BBP transitions strong finite-N corrections allow the
    retrieval of information at a signal-to-noise ratio (SNR) smaller than the predicted BBP transition. In these
    cases we provide estimates for a new lower SNR threshold that marks the point at which initialization becomes
    entirely uninformative.
  bibtex: |-
    @inproceedings{annesi2026overparametrization,
      title={Overparametrization bends the landscape: {BBP} transitions at initialization in simple Neural Networks},
      author={Annesi, Brandon Livio and Bocchi, Dario and Cammarota, Chiara},
      booktitle={Proceedings of the Fourteenth International Conference on Learning Representations ({ICLR})},
      year={2026},
      pages={117386--117411},
      url={https://openreview.net/forum?id=xDLE5n3x9Y}
    }

- title: "Implicit bias produces neural scaling laws in learning curves, from perceptrons to deep networks"
  image: images/papers/implicit-bias.png
  authors: "Francesco D'Amico, Dario Bocchi, Matteo Negri"
  year: 2026
  kind: conference
  venue: "ICLR 2026"
  venue_long: "International Conference on Learning Representations"
  url: https://openreview.net/forum?id=qBAV2DEvAC
  featured: true
  links:
    - { label: OpenReview, url: "https://openreview.net/forum?id=qBAV2DEvAC", icon: chat-square-text }
    - { label: arXiv, url: "https://arxiv.org/abs/2505.13230", icon: file-earmark-text }
    - { label: ICLR, url: "https://iclr.cc/virtual/2026/poster/10007275", icon: easel }
    - { label: Slides, url: "https://iclr.cc/media/iclr-2026/Slides/10007275.pdf", icon: file-slides }
    - { label: Poster, url: "https://iclr.cc/media/PosterPDFs/ICLR%202026/10007275.png", icon: image }
  abstract: >-
    Scaling laws in deep learning — empirical power-law relationships linking model performance to resource growth —
    have emerged as simple yet striking regularities across architectures, datasets, and tasks. These laws are
    particularly impactful in guiding the design of state-of-the-art models, since they quantify the benefits of
    increasing data or model size, and hint at the foundations of interpretability in machine learning. However, most
    studies focus on asymptotic behavior at the end of training. In this work, we describe a richer picture by
    analyzing the entire training dynamics: we identify two novel dynamical scaling laws that govern how performance
    evolves as function of different norm-based complexity measures. Combined, our new laws recover the well-known
    scaling for test error at convergence. Our findings are consistent across CNNs, ResNets, and Vision Transformers
    trained on MNIST, CIFAR-10 and CIFAR-100. Furthermore, we provide analytical support using a single-layer
    perceptron trained with logistic loss, where we derive the new dynamical scaling laws, and we explain them
    through the implicit bias induced by gradient-based training.
  bibtex: |-
    @inproceedings{damico2026implicit,
      title={Implicit bias produces neural scaling laws in learning curves, from perceptrons to deep networks},
      author={D'Amico, Francesco and Bocchi, Dario and Negri, Matteo},
      booktitle={Proceedings of the Fourteenth International Conference on Learning Representations ({ICLR})},
      year={2026},
      pages={54318--54344},
      url={https://openreview.net/forum?id=qBAV2DEvAC}
    }

- title: "Pseudo-likelihood produces associative memories able to generalize, even for asymmetric couplings"
  authors: "Francesco D'Amico, Dario Bocchi, Luca Maria Del Bono, Saverio Rossi, Matteo Negri"
  year: 2026
  kind: journal
  venue: "Physica A"
  venue_long: "Physica A: Statistical Mechanics and its Applications 692, 131497"
  url: https://doi.org/10.1016/j.physa.2026.131497
  links:
    - { label: DOI, url: "https://doi.org/10.1016/j.physa.2026.131497", icon: link-45deg }
    - { label: arXiv, url: "https://arxiv.org/abs/2507.05147", icon: file-earmark-text }
  abstract: >-
    Energy-based probabilistic models learned by maximizing the likelihood of the data are limited by the
    intractability of the partition function. A widely used workaround is to maximize the pseudo-likelihood, which
    replaces the global normalization with tractable local normalizations. Here we show that, in the zero-temperature
    limit, a network trained to maximize pseudo-likelihood naturally implements an associative memory: if the
    training set is small, patterns become fixed-point attractors whose basins of attraction exceed those of any
    classical Hopfield rule. We explain quantitatively this effect on uncorrelated random patterns. Moreover, we show
    that, for different structured datasets coming from computer science (random feature model, MNIST), physics (spin
    glasses) and biology (proteins), as the number of training examples increases the learned network goes beyond
    memorization, developing meaningful attractors with non-trivial correlations with test examples, thus showing the
    ability to generalize. Our results therefore reveal pseudo-likelihood works both as an efficient inference tool
    and as a principled mechanism for memory and generalization.
  bibtex: |-
    @article{damico2026pseudo,
      title={Pseudo-likelihood produces associative memories able to generalize, even for asymmetric couplings},
      author={D'Amico, Francesco and Bocchi, Dario and Del Bono, Luca Maria and Rossi, Saverio and Negri, Matteo},
      journal={Physica A: Statistical Mechanics and its Applications},
      volume={692},
      pages={131497},
      year={2026},
      doi={10.1016/j.physa.2026.131497}
    }

- title: "Learning and testing inverse statistical problems for interacting systems undergoing phase transition"
  authors: "Stefano Bae, Dario Bocchi, Luca Maria Del Bono, Luca Leuzzi"
  year: 2025
  kind: preprint
  venue: "arXiv:2507.02574"
  url: https://arxiv.org/abs/2507.02574
  links:
    - { label: arXiv, url: "https://arxiv.org/abs/2507.02574", icon: file-earmark-text }
    - { label: PDF, url: "https://arxiv.org/pdf/2507.02574", icon: file-earmark-pdf }
  abstract: >-
    Inverse problems arise in situations where data is available, but the underlying model is not. It can therefore
    be necessary to infer the parameters of the latter starting from the former. Statistical mechanics offers a
    toolbox of techniques to address this challenge. In this work, we illustrate three of the main methods: the
    Maximum Likelihood, Maximum Pseudo-Likelihood, and Mean-Field approaches. We begin with a thorough theoretical
    introduction to these methods, followed by their application to inference in several well-known statistical
    physics systems undergoing phase transitions. Namely, we consider the ordered and disordered Ising models, the
    vector Potts model, and the Blume–Capel model on both regular lattices and random graphs. This discussion is
    accompanied by a GitHub repository that allows users to both reproduce the results and experiment with new
    systems.
  bibtex: |-
    @article{bae2025learning,
      title={Learning and Testing Inverse Statistical Problems For Interacting Systems Undergoing Phase Transition},
      author={Bae, Stefano and Bocchi, Dario and Del Bono, Luca Maria and Leuzzi, Luca},
      journal={arXiv preprint arXiv:2507.02574},
      year={2025}
    }

- title: "Daydreaming Hopfield networks and their surprising effectiveness on correlated data"
  authors: "Ludovica Serricchio, Dario Bocchi, Claudio Chilin, Raffaele Marino, Matteo Negri, Chiara Cammarota, Federico Ricci-Tersenghi"
  year: 2025
  kind: journal
  venue: "Neural Networks"
  venue_long: "Neural Networks 186, 107216"
  url: https://doi.org/10.1016/j.neunet.2025.107216
  links:
    - { label: DOI, url: "https://doi.org/10.1016/j.neunet.2025.107216", icon: link-45deg }
    - { label: arXiv, url: "https://arxiv.org/abs/2405.08777", icon: file-earmark-text }
  abstract: >-
    To improve the storage capacity of the Hopfield model, we develop a version of the dreaming algorithm that
    perpetually reinforces the patterns to be stored (as in the Hebb rule), and erases the spurious memories (as in
    dreaming algorithms). For this reason, we called it Daydreaming. Daydreaming is not destructive and it converges
    asymptotically to stationary retrieval maps. When trained on random uncorrelated examples, the model shows optimal
    performance in terms of the size of the basins of attraction of stored examples and the quality of
    reconstruction. We also train the Daydreaming algorithm on correlated data obtained via the random-features model
    and argue that it spontaneously exploits the correlations thus increasing even further the storage capacity and
    the size of the basins of attraction. Moreover, the Daydreaming algorithm is also able to stabilize the features
    hidden in the data. Finally, we test Daydreaming on the MNIST dataset and show that it still works surprisingly
    well, producing attractors that are close to unseen examples and class prototypes.
  bibtex: |-
    @article{serricchio2025daydreaming,
      title={Daydreaming {H}opfield networks and their surprising effectiveness on correlated data},
      author={Serricchio, Ludovica and Bocchi, Dario and Chilin, Claudio and Marino, Raffaele and Negri, Matteo and Cammarota, Chiara and Ricci-Tersenghi, Federico},
      journal={Neural Networks},
      volume={186},
      pages={107216},
      year={2025},
      doi={10.1016/j.neunet.2025.107216}
    }
