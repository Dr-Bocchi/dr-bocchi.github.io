project:
  type: website
  output-dir: docs # GitHub Pages serves main:/docs
  resources:
    - bocchi_CV.pdf
    - myPapers.bib
    - assets/
    - photo.jpeg
    - images/papers/

website:
  title: "Dario Bocchi"
  description: "Statistical physics of learning — PhD in Theoretical Physics at Sapienza, incoming postdoc at ENS Paris."
  site-url: https://dr-bocchi.github.io/
  favicon: images/perceptron.svg
  open-graph: true
  search: false
  page-navigation: false
  navbar:
    background: none
    left:
      - href: index.qmd
        text: Home
      - href: papers.qmd
        text: Research
      - href: presentations.qmd
        text: Talks
    right:
      - icon: mortarboard-fill
        href: https://scholar.google.com/citations?user=LQc7rbIAAAAJ
        aria-label: Google Scholar
      - icon: github
        href: https://github.com/dr-bocchi
        aria-label: GitHub
      - icon: linkedin
        href: https://www.linkedin.com/in/dario-bocchi-025999218/
        aria-label: LinkedIn
      - icon: envelope
        href: mailto:bocchi.dario@gmail.com
        aria-label: Email
  page-footer:
    left: "© 2026 Dario Bocchi"

format:
  html:
    theme:
      light: [cosmo, theme-light.scss]
      dark: [cosmo, theme-dark.scss]
    respect-user-color-scheme: true
    css: styles.css
    toc: false
    anchor-sections: false
    smooth-scroll: true
    grid:
      body-width: 760px
      margin-width: 200px
    include-in-header:
      - text: |
          <script>document.documentElement.classList.add('js')</script>
          <link rel="preconnect" href="https://fonts.googleapis.com">
          <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
          <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    include-after-body:
      - text: |
          <script src="assets/site.js"></script>
